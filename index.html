<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게임머니 슬롯머신</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="bg-particles" id="bgParticles"></div>

  <div class="cabinet-stage" id="cabinetStage">
    <div class="cabinet" id="cabinet">
      <div class="rivet tl"></div>
      <div class="rivet tr"></div>
      <div class="rivet bl"></div>
      <div class="rivet br"></div>
      <div class="marquee-lights" id="marqueeLights"></div>
      <div class="confetti-layer" id="confettiLayer"></div>

      <div class="marquee pixel">GAME <span>MONEY</span> SLOTS</div>

      <div class="status-row">
        <div class="status-box">
          <div class="status-label pixel">CREDIT</div>
          <div class="status-value pixel" id="creditValue">100</div>
        </div>
        <div class="status-box">
          <div class="status-label pixel">LAST WIN</div>
          <div class="status-value pixel" id="lastWinValue">0</div>
        </div>
      </div>

      <div class="reel-window">
        <div class="payline"></div>
        <div class="win-banner" id="winBanner"><div class="txt pixel">WIN!</div></div>
        <div class="reel" id="reel0"><div class="reel-track" id="track0"></div><div class="glass"></div></div>
        <div class="reel" id="reel1"><div class="reel-track" id="track1"></div><div class="glass"></div></div>
        <div class="reel" id="reel2"><div class="reel-track" id="track2"></div><div class="glass"></div></div>
      </div>

      <div class="message pixel" id="message">레버를 당겨 게임을 시작하세요</div>

      <div class="controls">
        <div class="bet-control">
          <button class="bet-btn" id="betMinus" aria-label="배팅 감소">−</button>
          <div>
            <div class="status-label pixel">BET</div>
            <div class="bet-amount pixel" id="betValue">10</div>
          </div>
          <button class="bet-btn" id="betPlus" aria-label="배팅 증가">＋</button>
        </div>

        <div class="lever-wrap">
          <div class="lever-rail"></div>
          <div class="lever-base"></div>
          <button class="lever-handle" id="lever" aria-label="레버 당기기">
            <div class="knob"></div>
            <div class="stick"></div>
          </button>
        </div>
      </div>

      <button class="spin-btn" id="spinBtn">SPIN</button>

      <div class="paytable">
        <div class="paytable-title pixel">PAYTABLE (3개 일치 시 배당)</div>
        <div class="paytable-row" data-combo="7️⃣7️⃣7️⃣"><span class="paytable-symbols">7️⃣7️⃣7️⃣</span><span class="paytable-mult pixel">x50</span></div>
        <div class="paytable-row" data-combo="💎💎💎"><span class="paytable-symbols">💎💎💎</span><span class="paytable-mult pixel">x20</span></div>
        <div class="paytable-row" data-combo="🔔🔔🔔"><span class="paytable-symbols">🔔🔔🔔</span><span class="paytable-mult pixel">x10</span></div>
        <div class="paytable-row" data-combo="⭐⭐⭐"><span class="paytable-symbols">⭐⭐⭐</span><span class="paytable-mult pixel">x8</span></div>
        <div class="paytable-row" data-combo="🍇🍇🍇"><span class="paytable-symbols">🍇🍇🍇</span><span class="paytable-mult pixel">x5</span></div>
        <div class="paytable-row" data-combo="🍋🍋🍋"><span class="paytable-symbols">🍋🍋🍋</span><span class="paytable-mult pixel">x4</span></div>
        <div class="paytable-row" data-combo="🍒🍒🍒"><span class="paytable-symbols">🍒🍒🍒</span><span class="paytable-mult pixel">x3</span></div>
        <div class="paytable-row" data-combo="🍒🍒?"><span class="paytable-symbols">🍒🍒 (2개)</span><span class="paytable-mult pixel">x1</span></div>
      </div>

      <div class="reset-row">
        <button class="reset-btn" id="resetBtn">게임머니 리셋 (100)</button>
        <button class="reset-btn history-trigger" id="jackpotHistoryBtn">🏆 잭팟 내역 (0)</button>
      </div>
    </div>
  </div>

  <div class="history-overlay" id="historyOverlay">
    <div class="history-panel">
      <div class="history-header">
        <span class="history-title pixel">🏆 JACKPOT 내역</span>
        <button class="history-close" id="historyClose" aria-label="닫기">✕</button>
      </div>
      <div class="history-list" id="historyList"></div>
      <button class="history-clear-btn" id="historyClearBtn">내역 지우기</button>
    </div>
  </div>

<script src="./script.js" defer></script>

</body>
</html>
