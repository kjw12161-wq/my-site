<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게임머니 슬롯머신</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#150c2b;
    --cabinet:#2b1a4e;
    --cabinet-dark:#1d1236;
    --neon-magenta:#ff2fb0;
    --neon-cyan:#00e5ff;
    --neon-gold:#ffd23f;
    --ink:#f3eeff;
    --ink-dim:#b6a9de;
    --danger:#ff4d5e;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 50% -10%, #3a2266 0%, var(--bg-deep) 55%),
      var(--bg-deep);
    font-family:'Space Grotesk', sans-serif;
    color:var(--ink);
    padding:32px 16px;
    overflow-x:hidden;
    position:relative;
  }

  .pixel{ font-family:'Press Start 2P', monospace; }

  /* ---------- Ambient background ---------- */
  .bg-particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
  }
  .bg-dot{
    position:absolute;
    border-radius:50%;
    filter:blur(1px);
    opacity:.35;
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%{ transform:translateY(0) translateX(0); }
    50%{ transform:translateY(-24px) translateX(10px); }
    100%{ transform:translateY(0) translateX(0); }
  }

  /* ---------- Cabinet ---------- */
  .cabinet-stage{
    position:relative;
    z-index:1;
  }

  .cabinet{
    position:relative;
    width:min(500px, 92vw);
    background:
      linear-gradient(180deg, var(--cabinet) 0%, var(--cabinet-dark) 100%);
    border-radius:30px;
    padding:26px 24px 30px;
    box-shadow:
      0 0 0 2px #0d0620,
      0 0 0 8px #1d1236,
      0 0 0 10px #0a0518,
      0 40px 70px -20px rgba(0,0,0,0.75),
      inset 0 0 50px rgba(255,255,255,0.03);
    transition:transform 80ms ease;
  }
  .cabinet.shake{ animation:shake 420ms ease; }
  @keyframes shake{
    0%,100%{ transform:translate(0,0); }
    15%{ transform:translate(-6px,2px) rotate(-0.4deg); }
    30%{ transform:translate(5px,-3px) rotate(0.4deg); }
    45%{ transform:translate(-4px,3px) rotate(-0.3deg); }
    60%{ transform:translate(4px,-2px) rotate(0.3deg); }
    75%{ transform:translate(-2px,1px); }
  }

  .rivet{
    position:absolute;
    width:9px; height:9px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #6b5a99, #241536 70%);
    box-shadow:0 1px 0 rgba(255,255,255,0.1), inset 0 1px 1px rgba(0,0,0,.6);
  }
  .rivet.tl{ top:12px; left:12px; }
  .rivet.tr{ top:12px; right:12px; }
  .rivet.bl{ bottom:12px; left:12px; }
  .rivet.br{ bottom:12px; right:12px; }

  .marquee-lights{
    position:absolute;
    inset:6px;
    border-radius:24px;
    pointer-events:none;
    z-index:2;
  }
  .bulb{
    position:absolute;
    width:6px; height:6px;
    border-radius:50%;
    background:var(--neon-gold);
    box-shadow:0 0 4px var(--neon-gold), 0 0 8px rgba(255,210,63,.6);
    opacity:.25;
    animation:bulbPulse 1.6s ease-in-out infinite;
  }
  @keyframes bulbPulse{
    0%,100%{ opacity:.2; transform:scale(.85); }
    50%{ opacity:1; transform:scale(1.15); }
  }
  .cabinet.win .bulb{ animation-duration:.5s; }

  .marquee{
    position:relative;
    z-index:3;
    text-align:center;
    font-size:14px;
    line-height:1.9;
    letter-spacing:1.5px;
    color:var(--neon-cyan);
    text-shadow:0 0 6px var(--neon-cyan), 0 0 20px rgba(0,229,255,.6), 0 0 40px rgba(0,229,255,.25);
    margin-bottom:18px;
    animation:signalFlicker 6s ease-in-out infinite;
  }
  @keyframes signalFlicker{
    0%,92%,100%{ opacity:1; }
    93%{ opacity:.6; }
    94%{ opacity:1; }
    95%{ opacity:.7; }
    96%{ opacity:1; }
  }
  .marquee span{ color:var(--neon-magenta); text-shadow:0 0 6px var(--neon-magenta), 0 0 20px rgba(255,47,176,.6), 0 0 40px rgba(255,47,176,.25); }

  /* ---------- Status displays (LCD) ---------- */
  .status-row{
    position:relative;
    z-index:3;
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-bottom:16px;
  }
  .status-box{
    flex:1;
    position:relative;
    background:linear-gradient(180deg,#0a0518,#0d0620);
    border-radius:10px;
    padding:9px 10px;
    text-align:center;
    overflow:hidden;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,0.04);
  }
  .status-box::after{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px);
    pointer-events:none;
  }
  .status-label{
    font-size:8px;
    color:var(--ink-dim);
    letter-spacing:1.5px;
    margin-bottom:7px;
    position:relative;
  }
  .status-value{
    font-size:15px;
    color:var(--neon-gold);
    text-shadow:0 0 6px rgba(255,210,63,.6), 0 0 16px rgba(255,210,63,.3);
    position:relative;
  }
  .status-value.credit-flash{ animation: flashUp 550ms ease; }
  @keyframes flashUp{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.3); color:#fff; text-shadow:0 0 12px #fff; }
    100%{ transform:scale(1); }
  }

  /* ---------- Reels ---------- */
  .reel-window{
    position:relative;
    z-index:3;
    background:#08040f;
    border-radius:16px;
    padding:18px;
    display:flex;
    gap:12px;
    box-shadow:
      inset 0 10px 20px rgba(0,0,0,.7),
      inset 0 -10px 20px rgba(0,0,0,.7),
      0 0 0 1px rgba(255,255,255,0.04);
  }

  .payline{
    position:absolute;
    left:18px; right:18px;
    top:50%;
    height:2px;
    transform:translateY(-1px);
    background:linear-gradient(90deg, transparent, var(--neon-magenta) 15%, var(--neon-magenta) 85%, transparent);
    box-shadow:0 0 10px var(--neon-magenta), 0 0 20px rgba(255,47,176,.5);
    z-index:5;
    opacity:.75;
    animation:paylinePulse 2.4s ease-in-out infinite;
  }
  @keyframes paylinePulse{
    0%,100%{ opacity:.5; }
    50%{ opacity:.9; }
  }
  .payline::before, .payline::after{
    content:"";
    position:absolute;
    top:50%;
    width:0; height:0;
    border-top:5px solid transparent;
    border-bottom:5px solid transparent;
    transform:translateY(-50%);
  }
  .payline::before{ left:-9px; border-left:7px solid var(--neon-magenta); }
  .payline::after{ right:-9px; border-right:7px solid var(--neon-magenta); }

  .reel{
    flex:1;
    height:100px;
    position:relative;
    background:linear-gradient(180deg,#1b1132,#100a20 45%,#1b1132);
    border-radius:10px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.06);
  }
  .reel-track{
    position:absolute;
    left:0; right:0; top:0;
    will-change:transform;
  }
  .reel-cell{
    height:100px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));
  }
  .reel.spinning .reel-track{ filter:blur(3px); }
  .reel.spinning::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.05) 0 2px, transparent 2px 10px);
    animation:streak .15s linear infinite;
    z-index:2;
    pointer-events:none;
  }
  @keyframes streak{ to{ background-position:0 20px; } }

  .reel::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.55) 0%, transparent 22%, transparent 78%, rgba(0,0,0,.55) 100%);
    pointer-events:none;
    z-index:3;
  }
  .reel .glass{
    position:absolute; inset:0;
    background:linear-gradient(115deg, rgba(255,255,255,.14) 0%, transparent 30%, transparent 60%, rgba(255,255,255,.05) 100%);
    pointer-events:none;
    z-index:4;
  }

  /* ---------- Win banner ---------- */
  .win-banner{
    position:absolute;
    left:0; right:0; top:50%;
    transform:translateY(-50%) scale(.7);
    text-align:center;
    z-index:10;
    pointer-events:none;
    opacity:0;
    transition:opacity 220ms ease, transform 220ms ease;
  }
  .win-banner.show{
    opacity:1;
    transform:translateY(-50%) scale(1);
  }
  .win-banner .txt{
    font-size:20px;
    color:var(--neon-gold);
    text-shadow:0 0 10px var(--neon-gold), 0 0 26px rgba(255,210,63,.8), 0 2px 0 #7a5400;
    animation:bannerWobble 700ms ease-in-out infinite;
    letter-spacing:2px;
  }
  @keyframes bannerWobble{
    0%,100%{ transform:scale(1) rotate(-1deg); }
    50%{ transform:scale(1.08) rotate(1deg); }
  }

  /* ---------- Message line ---------- */
  .message{
    position:relative; z-index:3;
    text-align:center;
    margin:16px 0 8px;
    min-height:20px;
    font-size:11px;
    letter-spacing:.5px;
    color:var(--ink-dim);
    transition:color 200ms ease, text-shadow 200ms ease;
  }
  .message.win{ color:var(--neon-gold); text-shadow:0 0 10px rgba(255,210,63,.6); }
  .message.lose{ color:var(--ink-dim); }
  .message.broke{ color:var(--danger); text-shadow:0 0 8px rgba(255,77,94,.5); }

  /* ---------- Controls ---------- */
  .controls{
    position:relative; z-index:3;
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:16px;
  }

  .bet-control{
    flex:1;
    background:linear-gradient(180deg,#0a0518,#0d0620);
    border-radius:12px;
    padding:9px 11px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,0.04);
  }
  .bet-control .status-label{ margin:0; }
  .bet-btn{
    width:28px; height:28px;
    border-radius:8px;
    border:none;
    background:linear-gradient(180deg,#3a2566,#241546);
    color:var(--ink);
    font-size:15px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 0 #150a29, 0 0 0 1px rgba(255,255,255,.05);
    transition:transform 100ms ease, box-shadow 100ms ease, background 120ms ease;
  }
  .bet-btn:hover:not(:disabled){ background:linear-gradient(180deg,#4a2f80,#2c1a56); }
  .bet-btn:active:not(:disabled){ transform:translateY(2px); box-shadow:0 0 0 #150a29, 0 0 0 1px rgba(255,255,255,.05); }
  .bet-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .bet-amount{ font-size:12px; color:var(--neon-cyan); min-width:52px; text-align:center; text-shadow:0 0 8px rgba(0,229,255,.5); }

  .lever-wrap{
    width:70px;
    height:120px;
    position:relative;
    display:flex;
    justify-content:center;
  }
  .lever-base{
    position:absolute;
    bottom:0;
    width:32px; height:32px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #3e2a68, #0d0620 75%);
    box-shadow:inset 0 3px 8px rgba(0,0,0,.7), 0 0 0 2px rgba(255,255,255,.04);
  }
  .lever-rail{
    position:absolute;
    bottom:14px;
    width:7px;
    height:86px;
    border-radius:4px;
    background:linear-gradient(90deg,#0a0518,#1c1032,#0a0518);
    box-shadow:inset 0 0 4px rgba(0,0,0,.8);
  }
  .lever-handle{
    position:absolute;
    top:0;
    width:40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
    transform-origin:bottom center;
    transition:filter 140ms ease;
    background:none;
    border:none;
    padding:0;
  }
  .lever-handle .knob{
    width:38px; height:38px;
    border-radius:50%;
    background:radial-gradient(circle at 32% 26%, #ffc7ec 0%, #ff6fce 22%, var(--neon-magenta) 55%, #8c0d64 100%);
    box-shadow:0 0 16px rgba(255,47,176,.75), inset 0 -4px 6px rgba(0,0,0,.35), inset 0 3px 4px rgba(255,255,255,.5);
  }
  .lever-handle .stick{
    width:9px; height:76px;
    background:linear-gradient(90deg,#6b5f8f,#e4dcff 45%,#6b5f8f);
    border-radius:5px;
    margin-top:-5px;
    box-shadow:1px 0 2px rgba(0,0,0,.4);
  }
  .lever-handle:hover:not(:disabled) .knob{ filter:brightness(1.15); }
  .lever-handle:disabled{ cursor:not-allowed; opacity:.5; }
  .lever-handle.pulled{ animation: pull 620ms cubic-bezier(.34,1.56,.64,1); }
  @keyframes pull{
    0%{ transform:rotate(0deg); }
    40%{ transform:rotate(32deg); }
    65%{ transform:rotate(-4deg); }
    100%{ transform:rotate(0deg); }
  }

  .spin-btn{
    display:block;
    width:100%;
    margin-top:14px;
    padding:13px;
    border:none;
    border-radius:12px;
    background:linear-gradient(180deg, #ff5cc8, var(--neon-magenta) 45%, #b3157c);
    color:#fff;
    font-family:'Press Start 2P', monospace;
    font-size:12px;
    letter-spacing:1.5px;
    cursor:pointer;
    box-shadow:0 7px 0 #7a0e56, 0 10px 22px rgba(255,47,176,.4), inset 0 2px 2px rgba(255,255,255,.4);
    transition:transform 100ms ease, box-shadow 100ms ease, filter 100ms ease;
    position:relative; z-index:3;
  }
  .spin-btn:not(:disabled){ animation:invitePulse 2.2s ease-in-out infinite; }
  @keyframes invitePulse{
    0%,100%{ box-shadow:0 7px 0 #7a0e56, 0 10px 22px rgba(255,47,176,.4), inset 0 2px 2px rgba(255,255,255,.4); }
    50%{ box-shadow:0 7px 0 #7a0e56, 0 10px 32px rgba(255,47,176,.7), inset 0 2px 2px rgba(255,255,255,.5); }
  }
  .spin-btn:active:not(:disabled){
    transform:translateY(5px);
    box-shadow:0 2px 0 #7a0e56, 0 4px 10px rgba(255,47,176,.3);
  }
  .spin-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
    box-shadow:0 7px 0 #7a0e56;
    animation:none;
  }

  /* ---------- Paytable ---------- */
  .paytable{
    position:relative; z-index:3;
    margin-top:20px;
    background:linear-gradient(180deg,#0a0518,#0d0620);
    border-radius:14px;
    padding:14px 16px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,0.04);
  }
  .paytable-title{
    font-size:9px;
    letter-spacing:1.5px;
    color:var(--ink-dim);
    margin-bottom:10px;
  }
  .paytable-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 6px;
    font-size:12px;
    border-bottom:1px dashed rgba(255,255,255,0.07);
    border-radius:6px;
    transition:background 250ms ease, box-shadow 250ms ease;
  }
  .paytable-row:last-child{ border-bottom:none; }
  .paytable-row.highlight{
    background:rgba(255,210,63,.14);
    box-shadow:0 0 12px rgba(255,210,63,.25), inset 0 0 0 1px rgba(255,210,63,.3);
  }
  .paytable-symbols{ font-size:17px; letter-spacing:3px; filter:drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .paytable-mult{ color:var(--neon-gold); font-size:11px; text-shadow:0 0 6px rgba(255,210,63,.4); }

  .reset-row{
    position:relative; z-index:3;
    text-align:center;
    margin-top:16px;
  }
  .reset-btn{
    background:rgba(255,255,255,0.02);
    border:1px solid rgba(255,255,255,.18);
    color:var(--ink-dim);
    padding:9px 18px;
    border-radius:9px;
    font-size:10px;
    cursor:pointer;
    font-family:'Space Grotesk', sans-serif;
    transition:border-color 150ms ease, color 150ms ease, background 150ms ease;
  }
  .reset-btn:hover{ border-color:var(--neon-cyan); color:var(--neon-cyan); background:rgba(0,229,255,0.06); }

  /* ---------- Confetti ---------- */
  .confetti-layer{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    border-radius:30px;
    z-index:9;
  }
  .confetti-piece{
    position:absolute;
    top:-12px;
    width:7px; height:12px;
    opacity:.95;
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{
    to{ transform:translateY(420px) rotate(540deg); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .marquee-lights .bulb, .lever-handle.pulled, .status-value.credit-flash,
    .spin-btn:not(:disabled), .cabinet.shake, .win-banner .txt, .marquee,
    .payline, .bg-dot, .reel.spinning::before{ animation:none !important; }
  }
</style>
</head>
<body>

  <div class="bg-particles" id="bgParticles"></div>

  <div class="cabinet-stage">
    <div class="cabinet" id="cabinet">
      <div class="rivet tl"></div>
      <div class="rivet tr"></div>
      <div class="rivet bl"></div>
      <div class="rivet br"></div>
      <div class="marquee-lights" id="marqueeLights"></div>
      <div class="confetti-layer" id="confettiLayer"></div>

      <div class="marquee pixel">GAME <span>MONEY</span> SLOTS</div>

      <div class="status-row">
        <div class="status-box">
          <div class="status-label pixel">CREDIT</div>
          <div class="status-value pixel" id="creditValue">100</div>
        </div>
        <div class="status-box">
          <div class="status-label pixel">LAST WIN</div>
          <div class="status-value pixel" id="lastWinValue">0</div>
        </div>
      </div>

      <div class="reel-window">
        <div class="payline"></div>
        <div class="win-banner" id="winBanner"><div class="txt pixel">WIN!</div></div>
        <div class="reel" id="reel0"><div class="reel-track" id="track0"></div><div class="glass"></div></div>
        <div class="reel" id="reel1"><div class="reel-track" id="track1"></div><div class="glass"></div></div>
        <div class="reel" id="reel2"><div class="reel-track" id="track2"></div><div class="glass"></div></div>
      </div>

      <div class="message pixel" id="message">레버를 당겨 게임을 시작하세요</div>

      <div class="controls">
        <div class="bet-control">
          <button class="bet-btn" id="betMinus" aria-label="배팅 감소">−</button>
          <div>
            <div class="status-label pixel">BET</div>
            <div class="bet-amount pixel" id="betValue">10</div>
          </div>
          <button class="bet-btn" id="betPlus" aria-label="배팅 증가">＋</button>
        </div>

        <div class="lever-wrap">
          <div class="lever-rail"></div>
          <div class="lever-base"></div>
          <button class="lever-handle" id="lever" aria-label="레버 당기기">
            <div class="knob"></div>
            <div class="stick"></div>
          </button>
        </div>
      </div>

      <button class="spin-btn" id="spinBtn">SPIN</button>

      <div class="paytable">
        <div class="paytable-title pixel">PAYTABLE (3개 일치 시 배당)</div>
        <div class="paytable-row" data-combo="7️⃣7️⃣7️⃣"><span class="paytable-symbols">7️⃣7️⃣7️⃣</span><span class="paytable-mult pixel">x50</span></div>
        <div class="paytable-row" data-combo="💎💎💎"><span class="paytable-symbols">💎💎💎</span><span class="paytable-mult pixel">x20</span></div>
        <div class="paytable-row" data-combo="🔔🔔🔔"><span class="paytable-symbols">🔔🔔🔔</span><span class="paytable-mult pixel">x10</span></div>
        <div class="paytable-row" data-combo="⭐⭐⭐"><span class="paytable-symbols">⭐⭐⭐</span><span class="paytable-mult pixel">x8</span></div>
        <div class="paytable-row" data-combo="🍇🍇🍇"><span class="paytable-symbols">🍇🍇🍇</span><span class="paytable-mult pixel">x5</span></div>
        <div class="paytable-row" data-combo="🍋🍋🍋"><span class="paytable-symbols">🍋🍋🍋</span><span class="paytable-mult pixel">x4</span></div>
        <div class="paytable-row" data-combo="🍒🍒🍒"><span class="paytable-symbols">🍒🍒🍒</span><span class="paytable-mult pixel">x3</span></div>
        <div class="paytable-row" data-combo="🍒🍒?"><span class="paytable-symbols">🍒🍒 (2개)</span><span class="paytable-mult pixel">x1</span></div>
      </div>

      <div class="reset-row">
        <button class="reset-btn" id="resetBtn">게임머니 리셋 (100)</button>
      </div>
    </div>
  </div>

<script>
(function(){
  /* ============ 게임 시스템 (기존과 동일) ============ */
  const SYMBOL_TABLE = [
    { sym:'🍒', weight:30 },
    { sym:'🍋', weight:25 },
    { sym:'🍇', weight:20 },
    { sym:'🔔', weight:12 },
    { sym:'⭐', weight:7 },
    { sym:'💎', weight:4 },
    { sym:'7️⃣', weight:2 },
  ];
  const ALL_SYMBOLS = SYMBOL_TABLE.map(s => s.sym);
  const TOTAL_WEIGHT = SYMBOL_TABLE.reduce((a,s)=>a+s.weight,0);

  const PAYOUTS = {
    '7️⃣': 50, '💎': 20, '🔔': 10, '⭐': 8, '🍇': 5, '🍋': 4, '🍒': 3,
  };
  const CHERRY_PAIR_MULT = 1;
  const BET_MIN = 10, BET_MAX = 100, BET_STEP = 10;

  let credit = 100;
  let bet = 10;
  let spinning = false;

  const els = {
    cabinet: document.getElementById('cabinet'),
    credit: document.getElementById('creditValue'),
    lastWin: document.getElementById('lastWinValue'),
    reels: [document.getElementById('reel0'), document.getElementById('reel1'), document.getElementById('reel2')],
    tracks: [document.getElementById('track0'), document.getElementById('track1'), document.getElementById('track2')],
    message: document.getElementById('message'),
    betValue: document.getElementById('betValue'),
    betMinus: document.getElementById('betMinus'),
    betPlus: document.getElementById('betPlus'),
    lever: document.getElementById('lever'),
    spinBtn: document.getElementById('spinBtn'),
    resetBtn: document.getElementById('resetBtn'),
    paytableRows: document.querySelectorAll('.paytable-row'),
    winBanner: document.getElementById('winBanner'),
    confettiLayer: document.getElementById('confettiLayer'),
  };

  const CELL_HEIGHT = 100;

  function weightedRandomSymbol(){
    let r = Math.random() * TOTAL_WEIGHT;
    for(const entry of SYMBOL_TABLE){
      if(r < entry.weight) return entry.sym;
      r -= entry.weight;
    }
    return SYMBOL_TABLE[0].sym;
  }

  /* ============ 사운드 (Web Audio, 외부 리소스 없음) ============ */
  let audioCtx = null;
  function ctx(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function beep(freq, duration, type='square', gain=0.05, delay=0){
    try{
      const ac = ctx();
      const startAt = ac.currentTime + delay;
      const osc = ac.createOscillator();
      const g = ac.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, startAt);
      g.gain.setValueAtTime(gain, startAt);
      osc.connect(g); g.connect(ac.destination);
      osc.start(startAt);
      g.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
      osc.stop(startAt + duration + 0.02);
    }catch(e){ /* 오디오 미지원 시 무시 */ }
  }
  function playSequence(notes, type='square', gain=0.05){
    notes.forEach(n => beep(n.freq, n.dur, type, gain, n.at));
  }

  /* ============ 배경 파티클 ============ */
  function initBgParticles(){
    const layer = document.getElementById('bgParticles');
    const colors = ['#ff2fb0', '#00e5ff', '#ffd23f'];
    for(let i=0;i<16;i++){
      const dot = document.createElement('div');
      dot.className = 'bg-dot';
      const size = 3 + Math.random()*6;
      dot.style.width = size+'px';
      dot.style.height = size+'px';
      dot.style.left = Math.random()*100+'vw';
      dot.style.top = Math.random()*100+'vh';
      dot.style.background = colors[i % colors.length];
      dot.style.animationDuration = (5+Math.random()*6)+'s';
      dot.style.animationDelay = (Math.random()*4)+'s';
      layer.appendChild(dot);
    }
  }

  /* ============ 마퀴 전구 ============ */
  function initMarqueeBulbs(){
    const holder = document.getElementById('marqueeLights');
    const perSideTop = 11, perSideSide = 6;
    let idx = 0;
    const total = perSideTop*2 + perSideSide*2;
    function place(xPct, yPct){
      const b = document.createElement('div');
      b.className = 'bulb';
      b.style.left = xPct+'%';
      b.style.top = yPct+'%';
      b.style.animationDelay = ((idx / total) * 1.6)+'s';
      idx++;
      holder.appendChild(b);
    }
    for(let i=0;i<perSideTop;i++) place((i/(perSideTop-1))*100, 0);
    for(let i=0;i<perSideSide;i++) place(100, (i/(perSideSide-1))*100);
    for(let i=0;i<perSideTop;i++) place(100-(i/(perSideTop-1))*100, 100);
    for(let i=0;i<perSideSide;i++) place(0, 100-(i/(perSideSide-1))*100);
  }

  /* ============ 릴 스트립 빌드 & 스핀 ============ */
  function buildTrack(trackEl, fillerCount, finalSymbol){
    trackEl.innerHTML = '';
    trackEl.style.transition = 'none';
    trackEl.style.transform = 'translateY(0px)';
    for(let i=0;i<fillerCount;i++){
      const cell = document.createElement('div');
      cell.className = 'reel-cell';
      cell.textContent = weightedRandomSymbol();
      trackEl.appendChild(cell);
    }
    const finalCell = document.createElement('div');
    finalCell.className = 'reel-cell';
    finalCell.textContent = finalSymbol;
    trackEl.appendChild(finalCell);
    return fillerCount; // index of final cell
  }

  function spinOneReel(reelEl, trackEl, fillerCount, duration, tickFreq){
    return new Promise(resolve => {
      const finalSymbol = weightedRandomSymbol();
      const finalIndex = buildTrack(trackEl, fillerCount, finalSymbol);
      reelEl.classList.add('spinning');

      // 강제 리플로우 후 트랜지션 시작
      void trackEl.offsetHeight;
      trackEl.style.transition = `transform ${duration}ms cubic-bezier(.18,.86,.24,1)`;
      trackEl.style.transform = `translateY(-${finalIndex * CELL_HEIGHT}px)`;

      setTimeout(() => {
        reelEl.classList.remove('spinning');
      }, duration * 0.72);

      setTimeout(() => {
        beep(tickFreq, 0.09, 'square', 0.045);
        resolve(finalSymbol);
      }, duration);
    });
  }

  /* ============ 숫자 롤업 애니메이션 ============ */
  function animateNumber(el, from, to, duration){
    const startTime = performance.now();
    function step(now){
      const p = Math.min(1, (now - startTime) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      const val = Math.round(from + (to - from) * eased);
      el.textContent = val;
      if(p < 1) requestAnimationFrame(step);
      else el.textContent = to;
    }
    requestAnimationFrame(step);
  }

  /* ============ 컨페티 ============ */
  function burstConfetti(big){
    const layer = els.confettiLayer;
    const colors = ['#ff2fb0', '#00e5ff', '#ffd23f', '#f3eeff'];
    const count = big ? 46 : 24;
    for(let i=0;i<count;i++){
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random()*100+'%';
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDuration = (900 + Math.random()*700)+'ms';
      piece.style.animationDelay = (Math.random()*250)+'ms';
      piece.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
      layer.appendChild(piece);
      setTimeout(() => piece.remove(), 2200);
    }
  }

  function showWinBanner(text){
    els.winBanner.querySelector('.txt').textContent = text;
    els.winBanner.classList.add('show');
    setTimeout(() => els.winBanner.classList.remove('show'), 1300);
  }

  /* ============ UI 갱신 ============ */
  function updateCreditDisplay(flash, animateFrom){
    if(typeof animateFrom === 'number'){
      animateNumber(els.credit, animateFrom, credit, 550);
    } else {
      els.credit.textContent = credit;
    }
    if(flash){
      els.credit.classList.remove('credit-flash');
      void els.credit.offsetWidth;
      els.credit.classList.add('credit-flash');
    }
  }

  function updateBetDisplay(){
    els.betValue.textContent = bet;
    els.betMinus.disabled = spinning || bet <= BET_MIN;
    els.betPlus.disabled = spinning || bet >= BET_MAX || bet + BET_STEP > credit;
  }

  function setMessage(text, cls){
    els.message.textContent = text;
    els.message.className = 'message pixel' + (cls ? ' ' + cls : '');
  }

  function clearHighlights(){
    els.paytableRows.forEach(r => r.classList.remove('highlight'));
  }
  function highlightCombo(key){
    els.paytableRows.forEach(r => { if(r.dataset.combo === key) r.classList.add('highlight'); });
  }

  els.betMinus.addEventListener('click', () => {
    if(spinning) return;
    bet = Math.max(BET_MIN, bet - BET_STEP);
    updateBetDisplay();
    beep(260, 0.05, 'square', 0.03);
  });
  els.betPlus.addEventListener('click', () => {
    if(spinning) return;
    bet = Math.min(BET_MAX, bet + BET_STEP);
    updateBetDisplay();
    beep(320, 0.05, 'square', 0.03);
  });

  function evaluate(results){
    const [a,b,c] = results;
    clearHighlights();
    if(a === b && b === c){
      const mult = PAYOUTS[a];
      highlightCombo(a+a+a);
      return { win: bet * mult, comboText: a+a+a+' 일치!', jackpot: a === '7️⃣', tier: mult };
    }
    const cherryCount = results.filter(s => s === '🍒').length;
    if(cherryCount === 2){
      highlightCombo('🍒🍒?');
      return { win: bet * CHERRY_PAIR_MULT, comboText: '체리 2개!', jackpot:false, tier:1 };
    }
    return { win: 0, comboText: null, jackpot:false, tier:0 };
  }

  async function doSpin(){
    if(spinning) return;
    if(credit < bet){
      setMessage('게임머니가 부족합니다', 'broke');
      beep(120, 0.12, 'sine', 0.04);
      return;
    }

    spinning = true;
    els.spinBtn.disabled = true;
    els.lever.disabled = true;
    els.betMinus.disabled = true;
    els.betPlus.disabled = true;
    clearHighlights();
    els.winBanner.classList.remove('show');

    const creditBefore = credit;
    credit -= bet;
    updateCreditDisplay(false);
    els.lastWin.textContent = '0';
    setMessage('돌아가는 중...', null);

    els.lever.classList.remove('pulled');
    void els.lever.offsetWidth;
    els.lever.classList.add('pulled');
    beep(150, 0.05, 'triangle', 0.03);
    playSequence([
      {freq:440, dur:0.08, at:0.0},
      {freq:520, dur:0.08, at:0.06},
      {freq:600, dur:0.08, at:0.12},
    ], 'sine', 0.025);

    const plan = [
      { filler: 14, duration: 900,  tick: 520 },
      { filler: 20, duration: 1250, tick: 580 },
      { filler: 26, duration: 1600, tick: 660 },
    ];

    const results = [];
    for(let i=0;i<3;i++){
      results.push(await spinOneReel(els.reels[i], els.tracks[i], plan[i].filler, plan[i].duration, plan[i].tick));
    }

    const { win, comboText, jackpot, tier } = evaluate(results);

    if(win > 0){
      const before = credit;
      credit += win;
      els.lastWin.textContent = win;
      updateCreditDisplay(true, before);
      setMessage(comboText + '  +' + win, 'win');
      els.cabinet.classList.add('win');
      showWinBanner(jackpot ? 'JACKPOT!!' : 'WIN!');
      burstConfetti(jackpot || tier >= 10);

      if(jackpot){
        els.cabinet.classList.add('shake');
        setTimeout(() => els.cabinet.classList.remove('shake'), 450);
        playSequence([
          {freq:523,dur:0.16,at:0},{freq:659,dur:0.16,at:0.14},
          {freq:784,dur:0.16,at:0.28},{freq:1046,dur:0.3,at:0.42},
          {freq:784,dur:0.4,at:0.75}
        ], 'square', 0.06);
      } else if(tier >= 8){
        playSequence([
          {freq:523,dur:0.12,at:0},{freq:659,dur:0.12,at:0.1},{freq:784,dur:0.2,at:0.2}
        ], 'square', 0.055);
      } else {
        playSequence([
          {freq:523,dur:0.1,at:0},{freq:659,dur:0.16,at:0.09}
        ], 'square', 0.05);
      }
      setTimeout(() => els.cabinet.classList.remove('win'), 1500);
    } else {
      updateCreditDisplay(false);
      setMessage('꽝! 다시 도전해보세요', 'lose');
      playSequence([
        {freq:220,dur:0.14,at:0},{freq:160,dur:0.2,at:0.12}
      ], 'sine', 0.04);
    }

    if(credit <= 0){
      setTimeout(() => setMessage('게임머니 소진! 리셋 버튼을 눌러주세요', 'broke'), 1000);
    }

    spinning = false;
    els.spinBtn.disabled = credit < bet;
    els.lever.disabled = credit < bet;
    updateBetDisplay();
  }

  els.spinBtn.addEventListener('click', doSpin);
  els.lever.addEventListener('click', doSpin);

  els.resetBtn.addEventListener('click', () => {
    if(spinning) return;
    const before = credit;
    credit = 100;
    bet = 10;
    updateCreditDisplay(true, before);
    updateBetDisplay();
    setMessage('게임머니가 리셋되었습니다', null);
    els.spinBtn.disabled = false;
    els.lever.disabled = false;
    clearHighlights();
    els.winBanner.classList.remove('show');
    els.lastWin.textContent = '0';
    beep(440, 0.1, 'triangle', 0.04);
  });

  // 초기 릴 심볼 세팅 (정적)
  const initialSymbols = ['🍒','🍋','🔔'];
  els.tracks.forEach((t, i) => {
    const cell = document.createElement('div');
    cell.className = 'reel-cell';
    cell.textContent = initialSymbols[i];
    t.appendChild(cell);
  });

  initBgParticles();
  initMarqueeBulbs();
  updateCreditDisplay(false);
  updateBetDisplay();
})();
</script>
